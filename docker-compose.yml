# NeuroSonic AI: PostgreSQL + FastAPI backend + React frontend (nginx)
#   docker compose up --build   ->  http://localhost:8080   (API docs: http://localhost:8000/docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurosonic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurosonic}
      POSTGRES_DB: ${POSTGRES_DB:-neurosonic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurosonic} -d ${POSTGRES_DB:-neurosonic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-neurosonic}:${POSTGRES_PASSWORD:-neurosonic}@db:5432/${POSTGRES_DB:-neurosonic}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  appdata:
