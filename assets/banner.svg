    <rect x="630" y="120" width="8" height="140" rx="4" opacity="0.8"/><rect x="650" y="150" width="8" height="80" rx="4" opacity="0.9"/>
    <rect x="670" y="105" width="8" height="170" rx="4"/><rect x="690" y="140" width="8" height="100" rx="4" opacity="0.9"/>
